<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(0, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 750px;
        }
        .header {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 18px 20px;
            text-align: center;
            font-size: 1.4em;
            font-weight: 600;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            letter-spacing: 2px;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: transparent;
        }
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 2px 8px rgba(0, 229, 255, 0.2);
            color: #e0e0e0;
        }
        .message .author {
            font-weight: 600;
            font-size: 0.8em;
            margin-bottom: 4px;
            display: block;
            color: #00e5ff;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }
        .message .text {
            font-size: 1em;
            color: #f0f0f0;
        }
        .message .time {
            font-size: 0.7em;
            color: #888;
            margin-top: 6px;
            display: block;
            text-align: right;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-area {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .name-row input {
            width: 60%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 20px;
            font-size: 0.9em;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        .msg-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        .msg-row textarea {
            flex: 1;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 20px;
            font-size: 0.95em;
            color: #fff;
            resize: none;
            outline: none;
            height: 70px;
            transition: 0.3s;
            font-family: inherit;
        }
        .emoji-btn {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: #00e5ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.4em;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            flex-shrink: 0;
        }
        .send-btn {
            background: #00e5ff;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            color: #0a0a1a;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            flex-shrink: 0;
        }
        .emoji-picker {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .emoji-picker span {
            font-size: 1.3em;
            cursor: pointer;
        }
        .status-msg {
            text-align: center;
            font-size: 0.85em;
            color: #00e5ff;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">▼ CHAT ROOM</div>
    <div class="chat-area" id="chat"></div>
    <div class="input-area">
        <div class="name-row">
            <input type="text" id="nameInput" placeholder="Твой ник">
        </div>
        <div class="msg-row">
            <textarea id="messageInput" placeholder="Сообщение..."></textarea>
            <button class="emoji-btn" id="emojiBtn">😎</button>
            <button class="send-btn" onclick="sendMessage()">Отправить</button>
        </div>
        <div class="emoji-picker" id="emojiPicker">
            <span>😀</span><span>😂</span><span>🤣</span><span>😎</span><span>🔥</span>
            <span>💯</span><span>✨</span><span>🌟</span><span>💻</span><span>🎧</span>
            <span>🚀</span><span>🎮</span><span>👾</span><span>🕹️</span><span>📱</span>
            <span>🖤</span><span>💜</span><span>💙</span><span>💚</span><span>❤️</span>
            <span>👍</span><span>👏</span><span>🙌</span><span>🤝</span><span>💪</span>
        </div>
        <div id="status" class="status-msg"></div>
    </div>
</div>

<script>
    const API = 'https://functions.yandexcloud.net/d4esbgem029443pgug0u';

    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');
    const messageInput = document.getElementById('messageInput');

    emojiBtn.addEventListener('click', () => {
        emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
    });

    emojiPicker.addEventListener('click', (e) => {
        if (e.target.tagName === 'SPAN') {
            messageInput.value += e.target.textContent;
            emojiPicker.style.display = 'none';
            messageInput.focus();
        }
    });

    document.addEventListener('click', (e) => {
        if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) {
            emojiPicker.style.display = 'none';
        }
    });

    async function loadApproved() {
        try {
            const res = await fetch(API + '?path=/get_approved');
            const messages = await res.json();
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message received';
                const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) : '';
                div.innerHTML = `
                    <span class="author">${escapeHtml(msg.name)}</span>
                    <span class="text">${escapeHtml(msg.text)}</span>
                    <span class="time">${time}</span>
                `;
                chat.appendChild(div);
            });
            chat.scrollTop = chat.scrollHeight;
        } catch(e) {}
    }

    async function sendMessage() {
        const name = document.getElementById('nameInput').value.trim();
        const text = messageInput.value.trim();
        const statusEl = document.getElementById('status');
        if (!name || !text) {
            statusEl.textContent = 'Введи ник и сообщение';
            return;
        }
        try {
            const res = await fetch(API + '?path=/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, text })
            });
            if (res.ok) {
                statusEl.textContent = 'Отправлено на проверку';
                messageInput.value = '';
                emojiPicker.style.display = 'none';
            } else {
                statusEl.textContent = 'Ошибка отправки';
            }
        } catch (e) {
            statusEl.textContent = 'Нет связи';
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    setInterval(loadApproved, 3000);
    loadApproved();
</script>
</body>
</html>
