<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%; max-width: 550px;
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 229, 255, 0.1);
            overflow: hidden; display: flex; flex-direction: column;
            height: 90vh; max-height: 750px;
        }
        .header {
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding: 18px 20px; text-align: center;
            font-size: 1.4em; font-weight: 600; color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); letter-spacing: 2px;
        }
        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            background: transparent;
        }
        .message {
            max-width: 85%; padding: 12px 18px; border-radius: 18px;
            word-wrap: break-word; animation: fadeIn 0.3s ease;
            position: relative; font-size: 0.95em; line-height: 1.4;
        }
        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 2px 8px rgba(0, 229, 255, 0.2);
            color: #e0e0e0;
        }
        .message .text { font-size: 1em; color: #f0f0f0; }
        .message .time { font-size: 0.7em; color: #888; margin-top: 6px; display: block; text-align: right; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-area {
            padding: 15px 20px; background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            display: flex; flex-direction: column; gap: 8px;
        }
        /* Форма регистрации */
        .register-block {
            display: flex; flex-direction: column; gap: 8px;
        }
        .register-block input {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px; font-size: 0.95em; color: #fff;
            outline: none; transition: 0.3s;
        }
        .register-block button {
            background: #00e5ff; border: none; border-radius: 25px;
            padding: 10px 20px; color: #0a0a1a; font-weight: 700;
            font-size: 0.95em; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .error-msg { color: #ff4477; font-size: 0.85em; text-align: center; }
        /* Блок с ником и выходом */
        .user-row {
            display: flex; justify-content: space-between; align-items: center;
            color: #00e5ff; font-weight: 600; margin-bottom: 4px;
        }
        .user-row button {
            background: rgba(255, 68, 119, 0.9); border: none; border-radius: 15px;
            padding: 5px 15px; color: #fff; font-weight: 600; cursor: pointer;
            transition: 0.2s; font-size: 0.85em;
        }
        .msg-row { display: flex; gap: 10px; align-items: stretch; }
        .msg-row textarea {
            flex: 1; padding: 10px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px; font-size: 0.95em; color: #fff;
            resize: none; outline: none; height: 80px;
            transition: 0.3s; font-family: inherit;
        }
        .msg-row textarea:focus { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .emoji-btn {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.5); color: #00e5ff;
            border-radius: 50%; width: 50px; height: 50px;
            font-size: 1.4em; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); flex-shrink: 0;
        }
        .send-btn {
            background: #00e5ff; border: none; border-radius: 25px;
            padding: 10px 20px; color: #0a0a1a; font-weight: 700;
            font-size: 0.95em; cursor: pointer; transition: 0.3s;
            letter-spacing: 0.5px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            flex-shrink: 0;
        }
        .emoji-picker {
            display: none; flex-wrap: wrap; gap: 8px; padding: 8px;
            background: rgba(20, 20, 40, 0.95); border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .emoji-picker span { font-size: 1.3em; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">▼ CHAT ROOM</div>
    <div class="chat-area" id="chat"></div>
    <div class="input-area">
        <!-- Форма регистрации (видна, пока не пройдена проверка) -->
        <div id="registerBlock" class="register-block">
            <input type="text" id="regNick" placeholder="Твой ник">
            <input type="text" id="regCode" placeholder="Кодовое слово">
            <button onclick="register()">Войти в чат</button>
            <div id="regError" class="error-msg"></div>
        </div>

        <!-- Блок, появляющийся после успешной регистрации -->
        <div id="chatBlock" style="display: none;">
            <div class="user-row">
                <span id="currentNick"></span>
                <button onclick="logout()">Выйти</button>
            </div>
            <div class="msg-row">
                <textarea id="messageInput" placeholder="Сообщение..."></textarea>
                <button class="emoji-btn" id="emojiBtn">😎</button>
                <button class="send-btn" onclick="sendMessage()">Отправить</button>
            </div>
            <div class="emoji-picker" id="emojiPicker">
                <span>😀</span><span>😂</span><span>🤣</span><span>😎</span><span>🔥</span>
                <span>💯</span><span>✨</span><span>🌟</span><span>💻</span><span>🎧</span>
                <span>🚀</span><span>🎮</span><span>👾</span><span>🕹️</span><span>📱</span>
                <span>🖤</span><span>💜</span><span>💙</span><span>💚</span><span>❤️</span>
                <span>👍</span><span>👏</span><span>🙌</span><span>🤝</span><span>💪</span>
            </div>
        </div>
    </div>
</div>

<script>
    const API = 'https://functions.yandexcloud.net/d4esbgem029443pgug0u';
    const registerBlock = document.getElementById('registerBlock');
    const chatBlock = document.getElementById('chatBlock');
    const regNick = document.getElementById('regNick');
    const regCode = document.getElementById('regCode');
    const regError = document.getElementById('regError');
    const currentNickSpan = document.getElementById('currentNick');
    const messageInput = document.getElementById('messageInput');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');

    // Проверяем, не сохранён ли ник в localStorage (после успешной регистрации)
    let myNick = localStorage.getItem('chatNick');
    if (myNick) {
        registerBlock.style.display = 'none';
        chatBlock.style.display = 'block';
        currentNickSpan.textContent = myNick;
    }

    // Функция регистрации
    async function register() {
        const nick = regNick.value.trim();
        const code = regCode.value.trim();
        if (!nick || !code) {
            regError.textContent = 'Заполни оба поля';
            return;
        }
        try {
            const res = await fetch(API + '?path=/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: nick, code: code })
            });
            if (res.ok) {
                // Успех: сохраняем ник, показываем чат
                localStorage.setItem('chatNick', nick);
                myNick = nick;
                registerBlock.style.display = 'none';
                chatBlock.style.display = 'block';
                currentNickSpan.textContent = nick;
                regError.textContent = '';
            } else {
                const msg = await res.text();
                regError.textContent = msg || 'Неверный ник или кодовое слово';
            }
        } catch (e) {
            regError.textContent = 'Ошибка соединения';
        }
    }

    // Выход из чата
    function logout() {
        localStorage.removeItem('chatNick');
        myNick = null;
        registerBlock.style.display = 'flex';
        chatBlock.style.display = 'none';
        regNick.value = '';
        regCode.value = '';
    }

    // Обработчики эмодзи (без изменений)
    emojiBtn.addEventListener('click', () => {
        emojiPicker.style.display = emojiPicker.style.display === 'flex' ? 'none' : 'flex';
    });
    emojiPicker.addEventListener('click', (e) => {
        if (e.target.tagName === 'SPAN') {
            messageInput.value += e.target.textContent;
            emojiPicker.style.display = 'none';
            messageInput.focus();
        }
    });
    document.addEventListener('click', (e) => {
        if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) {
            emojiPicker.style.display = 'none';
        }
    });

    // Загрузка одобренных сообщений
    async function loadApproved() {
        try {
            const res = await fetch(API + '?path=/get_approved');
            const messages = await res.json();
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message received';
                const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) : '';
                div.innerHTML = `
                    <span class="text">${escapeHtml(msg.combined)}</span>
                    <span class="time">${time}</span>
                `;
                chat.appendChild(div);
            });
            chat.scrollTop = chat.scrollHeight;
        } catch(e) {}
    }

    // Отправка сообщения (ник уже гарантированно верный)
    async function sendMessage() {
        if (!myNick) {
            alert('Сначала войдите!');
            return;
        }
        const text = messageInput.value.trim();
        if (!text) return;
        try {
            const res = await fetch(API + '?path=/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: myNick, text })
            });
            if (res.ok) {
                messageInput.value = '';
                emojiPicker.style.display = 'none';
            }
        } catch(e) {}
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    setInterval(loadApproved, 3000);
    loadApproved();
</script>
</body>
</html>
