<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерация чата</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        .msg { border: 1px solid #ddd; padding: 10px; margin: 10px 0; background: #f9f9f9; }
        button { margin-right: 5px; padding: 5px 10px; }
        input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        #login, #panel { display: none; }
        .active { display: block !important; }
    </style>
</head>
<body>
    <h2>Модерация чата</h2>

    <div id="login" class="active">
        <p>Введите пароль модератора</p>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <p id="loginError" style="color:red"></p>
    </div>

    <div id="panel">
        <button onclick="logout()">Выйти</button>
        <h3>Сообщения на проверку:</h3>
        <div id="pendingList"></div>
    </div>

    <script>
        // Адрес вашей функции — уже подставлен
        const API = 'https://functions.yandexcloud.net/d4esbgem029443pgug0u';
        let PASSWORD = '';

        function login() {
            PASSWORD = document.getElementById('password').value;
            if (!PASSWORD) return;
            fetch(API + '?path=/get_pending', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: PASSWORD })
            })
            .then(res => {
                if (res.ok) {
                    document.getElementById('login').classList.remove('active');
                    document.getElementById('panel').classList.add('active');
                    loadPending();
                } else {
                    document.getElementById('loginError').textContent = 'Неверный пароль';
                }
            });
        }

        function logout() {
            PASSWORD = '';
            document.getElementById('panel').classList.remove('active');
            document.getElementById('login').classList.add('active');
            document.getElementById('password').value = '';
        }

        async function loadPending() {
            const res = await fetch(API + '?path=/get_pending', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: PASSWORD })
            });
            const messages = await res.json();
            const list = document.getElementById('pendingList');
            list.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'msg';
                div.id = 'msg-' + msg.id;
                div.innerHTML = `
                    <strong>${escapeHtml(msg.name)}</strong><br>
                    ${escapeHtml(msg.text)}<br>
                    <button onclick="approve('${msg.id}')">Одобрить</button>
                    <button onclick="reject('${msg.id}')">Отклонить</button>
                `;
                list.appendChild(div);
            });
        }

        async function approve(id) {
            await fetch(API + '?path=/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password: PASSWORD })
            });
            document.getElementById('msg-' + id)?.remove();
        }

        async function reject(id) {
            await fetch(API + '?path=/reject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, password: PASSWORD })
            });
            document.getElementById('msg-' + id)?.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
